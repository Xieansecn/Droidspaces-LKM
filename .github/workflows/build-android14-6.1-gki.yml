name: build-android14-6.1-gki

# Manual only. Builds the GKI namespace module for the local device kernel
# (6.1.138-android14-11-g0c3d559bcd85-ab14529422, KMI android14-6.1) in the
# pinned DDK image, so the amd64-only toolchain never runs on the device.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DDK_IMAGE: ghcr.io/ylarod/ddk-min@sha256:1dd6ac340b627a90a4031d6d0df6b129d8cc949b139fb56032c898f023d3d5d3
  KMI: android14-6.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build droidspaces_ns.ko in the pinned DDK
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/module" -w /module "$DDK_IMAGE" \
            make -j"$(nproc)" TARGET=namespace PORT_DIR=src/port61 \
              GKI_ANDROID=android14 GKI_VERSION=6.1 \
              OUT="/module/out/gki/$KMI" 2>&1 | tee build.log
          ! grep -q 'undefined!' build.log

      - name: Record the DDK baseline and module imports
        run: |
          docker run --rm -e KMI -v "$PWD:/module" -w /module "$DDK_IMAGE" sh -euc '
            out=/module/out/gki/$KMI
            cp "$KDIR/.config" "$KDIR/include/config/kernel.release" "$out/"
            grep -q "^CONFIG_ARM64_4K_PAGES=y$" "$KDIR/.config"
            grep -q "^CONFIG_MODVERSIONS=y$" "$KDIR/.config"
            grep -cE "^CONFIG_(PID_NS|IPC_NS|POSIX_MQUEUE|MODULE_UNLOAD)=y$" "$KDIR/.config"
            llvm-nm -u "$out/droidspaces_ns.ko" | tee "$out/imports.txt"
          '

      - name: Verify the module payload
        run: |
          set -eu
          out="out/gki/$KMI"
          ko="$out/droidspaces_ns.ko"
          sudo chown -R "$(id -u):$(id -g)" out
          mv build.log "$out/build.log"
          test -s "$ko"
          release=$(cat "$out/kernel.release")
          readelf -p .modinfo "$ko" > "$out/modinfo.txt"
          file "$ko"
          readelf -h "$ko" | grep -E 'Class:|Type:|Machine:'
          grep -Fq 'parmtype=gki:bool' "$out/modinfo.txt"
          grep -Fq "vermagic=$release " "$out/modinfo.txt"
          grep -Fq 'modversions aarch64' "$out/modinfo.txt"
          vermagic=$(grep -o 'vermagic=.*' "$out/modinfo.txt")
          cp "$ko" "$out/droidspaces_ns-$KMI-gki.ko"
          {
            echo '{'
            echo "  \"kmi\": \"$KMI\","
            echo "  \"ddk_image\": \"$DDK_IMAGE\","
            echo '  "make": "TARGET=namespace PORT_DIR=src/port61 GKI_ANDROID=android14 GKI_VERSION=6.1",'
            echo "  \"kernel_release\": \"$release\","
            echo "  \"vermagic\": \"$vermagic\","
            echo "  \"size\": $(stat -c %s "$ko"),"
            echo "  \"module_sha256\": \"$(sha256sum "$ko" | cut -d' ' -f1)\""
            echo '}'
          } > "$out/build.json"
          cat "$out/build.json"
          (cd "$out" && sha256sum droidspaces_ns.ko "droidspaces_ns-$KMI-gki.ko") | tee "$out/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: droidspaces_ns-android14-6.1-gki
          path: out/gki/android14-6.1/
          if-no-files-found: error
